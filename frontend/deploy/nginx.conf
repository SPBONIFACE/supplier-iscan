# Static server for the built frontend (Cloud Run). Listens on 8080 (the image's unprivileged user).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Hashed build files never change; the entry page and the run-time config are always re-read.
  # (nginx drops inherited add_header lines inside a location that sets its own, so each repeats them.)
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    try_files $uri =404;
  }
  location = /config.js {
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    try_files $uri =404;
  }
  # Single-page application: any other path is a client-side route.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri /index.html;
  }
}
