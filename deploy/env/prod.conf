# Cloud Run sizing of the PRODUCTION environment (read by deploy/deploy.sh; shell syntax, no secret).
# Why these numbers: _docs/operations/cloud-run-sizing.md
API_CPU=2
API_MEMORY=4Gi
API_CONCURRENCY=8
API_TIMEOUT_SECONDS=300
# 0 = scales to zero (cheapest; the first request after a pause waits for the start). 1 keeps one
# instance warm (an always-on 2 CPU, 4 GiB instance: check the current Cloud Run price); the
# name-detection model still loads at first use in either case.
API_MIN_INSTANCES=0
API_MAX_INSTANCES=3
WORKER_CPU=4
WORKER_MEMORY=4Gi
WORKER_INSTANCES=1
WEB_CPU=1
WEB_MEMORY=256Mi
WEB_MAX_INSTANCES=3
COLLECTOR_CPU=1
COLLECTOR_MEMORY=512Mi
