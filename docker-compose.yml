# Local system: database, API and frontend. Started with `make run`.
# Every value can be overridden by an environment variable (or a local .env file, which is never
# committed). The database and administrator defaults are for local use only.
name: supplier-iscan

services:
  db:
    image: postgres:16.15-trixie@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supplier_iscan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supplier_iscan_local}
      POSTGRES_DB: ${POSTGRES_DB:-supplier_iscan}
    ports:
      # Loopback only: the database is not reachable from another machine.
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-supplier_iscan}:${POSTGRES_PASSWORD:-supplier_iscan_local}@db:5432/${POSTGRES_DB:-supplier_iscan}}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      INSTANCE_MODE: ${INSTANCE_MODE:-self_hosted}
      # Local administrator, created on first start only (empty database). These defaults are for
      # local use only and live only here: the application itself has none and refuses to start
      # without both values. Override them with ADMIN_EMAIL and ADMIN_PASSWORD.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-local-only-admin-change-me}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api

volumes:
  db-data:
