openapi: 3.1.0
info:
  title: Supplier iScan API
  version: 0.11.0
  description: >-
    API contract of Supplier iScan. This file is the source of truth: it changes before the code.


    Authentication: `POST /auth/login` sets a session cookie (`HttpOnly`, `Secure`, `SameSite=Lax`).
    Every operation that declares the `sessionCookie` security requirement answers 401 when the
    cookie is missing, expired, revoked by a logout, or tampered with.


    Organisation isolation: every member operation is scoped to the organisation of the session;
    no member operation takes an organisation id from the client. A request for a resource of
    another organisation answers the shared `NotFound` response, identical to the answer for an id
    that does not exist. An administrator reads the content of an organisation (supplier names,
    fact values, quotes, corrections, criteria, notes, assessments) only as a member of that
    organisation, like any member: the local administrator of a self-hosted instance reaches the
    default organisation's content, and no other.
servers:
  - url: http://localhost:8000
    description: Local development (Docker Compose)
tags:
  - name: system
    description: Operational endpoints
  - name: auth
    description: Sign-in, sign-out and the current user
  - name: identity
    description: Identity chat that turns a supplier name into a confirmed identity record
  - name: users
    description: User records
  - name: organisation
    description: The signed-in member's own organisation
  - name: profile
    description: The profile definition loaded at startup
  - name: runs
    description: Profile runs. They execute in a worker; no request waits for a stage.
  - name: admin
    description: Administrator operations. A signed-in member gets 403 on every one of them.
  - name: invitations
    description: Public invitation links (the token is the credential)
# Operations are public unless they declare `security`.
paths:
  /health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Report whether the API and its database are available
      description: >-
        Always answers while the API process runs. Returns 200 when the database answers, and 503
        when it does not. The body never contains error details. `missing_settings` names the API
        key settings that the provider configurations selected for retrieval and structuring need
        and that are not set; it gives names only, never a value, and does not change the status.
      responses:
        "200":
          description: The API and the database are available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                api: available
                database: available
                missing_settings: []
        "503":
          description: The API is running but the database is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                api: available
                database: unavailable
                missing_settings: [GEMINI_API_KEY]
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with email and password
      description: >-
        On success, sets the session cookie and returns the signed-in user. A wrong password and an
        unknown email get the same 401 answer, so the response never reveals whether an account
        exists. Each attempt, successful or not, is recorded in the usage log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in. The session cookie is set.
          headers:
            Set-Cookie:
              description: >-
                `supplier_iscan_session=<token>; HttpOnly; Secure; SameSite=Lax; Path=/;
                Max-Age=<seconds>`. Only a hash of the token is stored on the server.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out
      description: >-
        Revokes the current session on the server and clears the cookie. Replaying the old cookie
        afterwards answers 401.
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Signed out. The session cookie is cleared.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Return the signed-in user
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The user of the current session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Read a user record
      description: >-
        A member reads only their own record; any other id answers 404 with the same body as an
        id that does not exist. An administrator reads any user.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /organisation:
    get:
      operationId: getOwnOrganisation
      tags: [organisation]
      summary: Return the signed-in member's own organisation
      description: >-
        The organisation of the session, never another one: there is no organisation id to pass.
        Also says how many profiles may still be started and whether a new run would be refused
        right now, and why, so that the workspace can show it before the member starts. No spend
        amount is exposed.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The member's own organisation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberOrganisation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /profile-definition:
    get:
      operationId: getProfileDefinition
      tags: [profile]
      summary: Return the active profile definition
      description: >-
        The sections and fields of a profile, loaded at startup from the instance's profile
        definition file (the shipped example when none is configured), with labels in the requested
        language and the content hash that each run records. Any signed-in member may read it.
      security:
        - sessionCookie: []
      parameters:
        - name: language
          in: query
          required: false
          description: Language of the labels. English when absent.
          schema:
            type: string
            enum: [en, fr]
            default: en
      responses:
        "200":
          description: The active definition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileDefinition"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /identity/disclosure:
    get:
      operationId: getIdentityDisclosure
      tags: [identity]
      summary: The AI disclosure, in the requested UI language
      description: >-
        The text the chat shows as its first message, exactly as in spec F1 (no placeholder). The
        client displays it as returned and never rewords it.
      security:
        - sessionCookie: []
      parameters:
        - name: language
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Language"
      responses:
        "200":
          description: The disclosure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityDisclosure"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /identity-sessions:
    post:
      operationId: createIdentitySession
      tags: [identity]
      summary: Open an identity session for a supplier name and optional hints
      description: >-
        An empty, whitespace-only or zero-width-only name, or an invalid website hint, answers 422
        with the field name. The first turn of the session is the disclosure; the agent's first
        proposal follows. When one or both registries are unreachable the agent says so in a
        turn, never with an error response.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentitySessionCreate"
      responses:
        "201":
          description: The session, with its first proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentitySession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /identity-sessions/{id}:
    get:
      operationId: getIdentitySession
      tags: [identity]
      summary: Read an identity session
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The session with all its turns.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentitySession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /identity-sessions/{id}/messages:
    post:
      operationId: sendIdentityMessage
      tags: [identity]
      summary: Correct or add details in free text; the agent proposes again
      description: >-
        Triggers a new registry search and a new proposal. A URL inside the text goes through the
        outbound-URL guard. An agent failure is a turn of kind `error` in the session (answer 200),
        never a 500. A confirmed session answers 409.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityMessage"
      responses:
        "200":
          description: The session with the new turns.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentitySession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /identity-sessions/{id}/candidates:
    get:
      operationId: listIdentityCandidates
      tags: [identity]
      summary: The candidates other than the current proposal, best match first
      description: A hint lowers a candidate's rank and never removes it.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The other candidates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityCandidateList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /identity-sessions/{id}/website:
    post:
      operationId: submitIdentityWebsite
      tags: [identity]
      summary: "None of these: propose an identity from a website or domain"
      description: >-
        The domain is checked by the outbound-URL guard and must respond. If it does, the new
        proposal is the last turn. If not, the last turn has kind `website_rejected` and carries
        the reason, and the session stays open (answer 200). A malformed address answers 422.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityWebsite"
      responses:
        "200":
          description: The session with the new turns.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentitySession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /identity-sessions/{id}/confirm:
    post:
      operationId: confirmIdentity
      tags: [identity]
      summary: Confirm one candidate; this stores the identity record
      description: >-
        The only way a session ends. A second confirmation answers 409. `natural_person` is set
        when the legal form is a sole trader or another natural-person business.
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityConfirm"
      responses:
        "200":
          description: The stored identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityConfirmed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /runs:
    post:
      operationId: startRun
      tags: [runs]
      summary: Start a profile run for a confirmed supplier identity
      description: >-
        Queues the run and answers 202 at once; no stage executes in the request. The identity
        must be confirmed and belong to the member's organisation; an identity that is
        unconfirmed, unknown or another organisation's answers 404. Each start is recorded in the
        usage log (kind `run`).
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunStart"
      responses:
        "202":
          description: The run is queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            The run is refused, with the reason (#29): the profile quota is used, access has ended,
            the organisation is not activated, or the monthly spend cap is reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunRefused"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      operationId: listRuns
      tags: [runs]
      summary: List the organisation's runs, newest first
      description: >-
        At most the 100 most recent runs of the member's organisation. On a hosted instance an
        administrator gets run metadata only (status, stage, cost, errors): `supplier_name` is
        null for them. The local administrator of a self-hosted instance is a member of the
        default organisation and reads its names.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /runs/{id}:
    get:
      operationId: getRun
      tags: [runs]
      summary: Read a run
      description: >-
        Status, stage, provider and model ID per role, tokens and cost (totals of every attempt,
        failed and retried ones included). On a hosted instance an administrator gets
        run metadata only: `supplier_name` is null for them.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /runs/{id}/sources:
    get:
      operationId: listRunSources
      tags: [runs]
      summary: List the sources collected for a run
      description: >-
        The pages and PDFs the collection stage stored for the run: URL, fetch time and content
        type, oldest first. The extracted text is not part of the listing. Another organisation's
        run answers 404, like an unknown id.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The sources of the run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /runs/{id}/failures:
    get:
      operationId: listRunFailures
      tags: [runs]
      summary: List the collection failures of a run
      description: >-
        The failure log of the collection stage, oldest first: for each failure the address, the
        strategy tried, the kind of failure, the next strategy chosen and a plain-language
        message. Another organisation's run answers 404, like an unknown id.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The failures of the run (empty when there were none).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunFailureList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /runs/{id}/facts:
    get:
      operationId: listRunFacts
      tags: [runs]
      summary: List the facts extracted for a run
      description: >-
        One entry per `fact` field of the profile definition the run uses, in the order of the
        definition: a proposed fact (value, verbatim quote in its source language, source,
        attribution) or `not_found`, which is shown as "No public evidence found". It is never a
        negative statement about the supplier: an entry without a kept value carries no value and
        no quote, and a certification field without a kept value is `not_found`, never "not
        certified". Empty until the extraction stage has stored its results. Another
        organisation's run answers 404, like an unknown id.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The facts of the run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FactList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /runs/{id}/stop:
    post:
      operationId: stopRun
      tags: [runs]
      summary: Stop a run
      description: >-
        Any member of the organisation may stop a run. A queued or paused run becomes `stopped`
        at once. A running run is flagged (`stop_requested`) and ends `stopped` at the next stage
        boundary or before its next provider call. A finished run answers 409.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The run, stopped or flagged to stop.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The run has already finished.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /runs/{id}/resume:
    post:
      operationId: resumeRun
      tags: [runs]
      summary: Resume a paused run
      description: >-
        Continues a `paused` run from the stage where it paused, without repeating stored
        results. The run is queued again (202). A run that is not paused answers 409.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "202":
          description: The run is queued again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The run is not paused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /admin/organisations:
    post:
      operationId: createOrganisation
      tags: [admin]
      summary: Create an organisation with its limits
      description: >-
        Administrator only. The organisation starts in status `pending_activation`, or `active` on
        a self-hosted instance (`INSTANCE_MODE=self_hosted`), where activation is skipped. A limit
        left empty or null means unlimited. The access period starts at activation: on a
        self-hosted instance at once, so `access_ends_at` is set on creation; otherwise it stays
        null until the organisation is activated.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganisationCreate"
      responses:
        "201":
          description: The organisation was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organisation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      operationId: listOrganisations
      tags: [admin]
      summary: List the organisations
      description: Administrator only. Oldest first.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: All organisations of the instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /admin/organisations/{id}:
    patch:
      operationId: extendOrganisationAccess
      tags: [admin]
      summary: Extend an organisation's access
      description: >-
        Administrator only. Sets a later `access_ends_at`. A date that is not later than the
        current one, or not in the future, answers 422.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganisationAccessUpdate"
      responses:
        "200":
          description: The updated organisation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organisation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /admin/organisations/{id}/invitations:
    post:
      operationId: createInvitation
      tags: [admin]
      summary: Invite a person into an organisation
      description: >-
        Administrator only. Returns a single-use link for the administrator to send (no email is
        sent). Only a hash of the token is stored, so the link cannot be shown again. The
        invitation expires after the configured delay (`INVITATION_VALIDITY_HOURS`). An email that
        already has an account answers 409.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCreate"
      responses:
        "201":
          description: The invitation was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedInvitation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: An account already exists for this email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: An account already exists for this email.
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /admin/invitations/{id}:
    delete:
      operationId: revokeInvitation
      tags: [admin]
      summary: Revoke an unused invitation
      description: >-
        Administrator only. Accepting the invitation is refused afterwards. Revoking an invitation
        that is already revoked changes nothing (204); one that was already used answers 409.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "204":
          description: The invitation is revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The invitation was already used.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: This invitation has already been used.
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /invitations/{token}:
    get:
      operationId: checkInvitation
      tags: [invitations]
      summary: Check an invitation link
      description: >-
        Public: the token is the credential. A used, expired, revoked or unknown token answers the
        same 404, which says nothing about any account.
      parameters:
        - $ref: "#/components/parameters/InvitationToken"
      responses:
        "200":
          description: The invitation is valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationCheck"
        "404":
          $ref: "#/components/responses/InvalidInvitation"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /invitations/{token}/accept:
    post:
      operationId: acceptInvitation
      tags: [invitations]
      summary: Accept an invitation and set a password
      description: >-
        Public: the token is the credential. Creates the user (role `member`) in the invitation's
        organisation, marks the invitation used and signs the person in: the session cookie is set
        as on `POST /auth/login`. A used, expired, revoked or unknown token answers the same 404.
        A password shorter than the configured minimum (`PASSWORD_MIN_LENGTH`) answers 422. When
        the organisation has as many members as its seat limit, the answer is 409.
      parameters:
        - $ref: "#/components/parameters/InvitationToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationAccept"
      responses:
        "200":
          description: The account is created and the person is signed in.
          headers:
            Set-Cookie:
              description: The session cookie, exactly as set by `POST /auth/login`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "404":
          $ref: "#/components/responses/InvalidInvitation"
        "409":
          description: The organisation has no free seat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: Seat limit reached.
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: The resource's UUID. A value that is not a UUID answers 404, as an unknown id.
      schema:
        type: string
    InvitationToken:
      name: token
      in: path
      required: true
      description: The token from the invitation link.
      schema:
        type: string
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: supplier_iscan_session
      description: >-
        Opaque session token set by `POST /auth/login`. Sessions are stored on the server and
        expire; logout revokes them.
  responses:
    Unauthorized:
      description: >-
        No valid session (missing, expired, revoked or tampered cookie), or, for login, a wrong
        email or password. The message is generic.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            session:
              value:
                detail: Authentication required.
            login:
              value:
                detail: Incorrect email or password.
    ValidationFailed:
      description: >-
        The request body is malformed or a field is missing, empty or too long. Submitted values are
        never echoed back.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
          example:
            detail: The request is not valid.
            errors:
              - field: email
                message: Email is required.
    Forbidden:
      description: Signed in, but this operation is for administrators only.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            detail: Administrator access required.
    NotFound:
      description: >-
        The resource does not exist, or the caller may not see it. Both answers are identical, so
        that the existence of a resource is never revealed. This is the response of every
        operation for a resource outside the caller's organisation (another organisation's
        resource, or, for an administrator, the content of an organisation they are not a member
        of).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            detail: Not found.
    InvalidInvitation:
      description: >-
        The invitation link cannot be used: it is unknown, expired, revoked or already used. The
        message is the same in every case.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            detail: This invitation link is not valid. Ask your administrator for a new one.
    Conflict:
      description: The request conflicts with the current state (for example an identity already confirmed).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            detail: This identity is already confirmed.
    ServiceUnavailable:
      description: The database is unavailable. Plain message, no technical details.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            detail: The service is temporarily unavailable. Please try again in a few minutes.
  schemas:
    Language:
      type: string
      enum: [en, fr]
    IdentityDisclosure:
      type: object
      additionalProperties: false
      required: [language, text]
      properties:
        language:
          $ref: "#/components/schemas/Language"
        text:
          type: string
    IdentityHints:
      type: object
      additionalProperties: false
      properties:
        website:
          type: [string, "null"]
        country:
          description: ISO 3166-1 alpha-2 code.
          type: [string, "null"]
        sector:
          type: [string, "null"]
    IdentitySessionCreate:
      type: object
      additionalProperties: false
      required: [name, profile_language, ui_language]
      properties:
        name:
          type: string
          maxLength: 300
        hints:
          $ref: "#/components/schemas/IdentityHints"
        profile_language:
          $ref: "#/components/schemas/Language"
        ui_language:
          $ref: "#/components/schemas/Language"
    IdentityMessage:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          maxLength: 2000
    IdentityWebsite:
      type: object
      additionalProperties: false
      required: [website]
      properties:
        website:
          description: A URL or a bare domain.
          type: string
          maxLength: 2000
    IdentityConfirm:
      type: object
      additionalProperties: false
      required: [candidate_id]
      properties:
        candidate_id:
          type: string
    RegistryStatus:
      type: object
      additionalProperties: false
      required: [gleif, wikidata]
      properties:
        gleif:
          type: string
          enum: [ok, unreachable]
        wikidata:
          type: string
          enum: [ok, unreachable]
    IdentityCandidate:
      type: object
      additionalProperties: false
      required: [id, legal_name, legal_form, website, country, sector, description, found_in, identifiers]
      properties:
        id:
          type: string
        legal_name:
          type: string
        legal_form:
          type: [string, "null"]
        website:
          type: [string, "null"]
        country:
          description: Country name in the session's UI language.
          type: [string, "null"]
        sector:
          type: [string, "null"]
        description:
          description: One line.
          type: [string, "null"]
        found_in:
          type: array
          items:
            type: string
            enum: [gleif, wikidata, website, web]
        identifiers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [scheme, value]
            properties:
              scheme:
                type: string
              value:
                type: string
    IdentityCandidateList:
      type: object
      additionalProperties: false
      required: [candidates]
      properties:
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/IdentityCandidate"
    IdentityTurn:
      type: object
      additionalProperties: false
      required: [id, role, kind, text, candidate, created_at]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [assistant, user]
        kind:
          description: >-
            `disclosure` is always the first turn. `proposal` carries the top candidate.
            `notice` is an agent message without candidate (for example both registries down).
            `website_rejected` carries the reason a website was refused. `error` is an agent
            failure in plain words.
          type: string
          enum: [disclosure, text, proposal, notice, website_rejected, error]
        text:
          type: string
        candidate:
          oneOf:
            - $ref: "#/components/schemas/IdentityCandidate"
            - type: "null"
        created_at:
          type: string
          format: date-time
    IdentitySession:
      type: object
      additionalProperties: false
      required: [id, name, hints, profile_language, status, turns, registries, identity_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        hints:
          $ref: "#/components/schemas/IdentityHints"
        profile_language:
          $ref: "#/components/schemas/Language"
        status:
          type: string
          enum: [open, confirmed]
        turns:
          type: array
          items:
            $ref: "#/components/schemas/IdentityTurn"
        registries:
          $ref: "#/components/schemas/RegistryStatus"
        identity_id:
          type: [string, "null"]
          format: uuid
        created_at:
          type: string
          format: date-time
    IdentityConfirmed:
      type: object
      additionalProperties: false
      required: [identity_id, candidate, natural_person, confirmed_at]
      properties:
        identity_id:
          type: string
          format: uuid
        candidate:
          $ref: "#/components/schemas/IdentityCandidate"
        natural_person:
          type: boolean
        confirmed_at:
          type: string
          format: date-time
    RunRefused:
      type: object
      additionalProperties: false
      required: [detail, reason]
      properties:
        detail:
          type: string
        reason:
          type: string
          enum: [quota_reached, access_ended, not_activated, spend_cap_reached]
    ProfileField:
      type: object
      additionalProperties: false
      required: [id, label, kind, certification, concerns_people]
      properties:
        id:
          type: string
        label:
          type: string
        kind:
          type: string
          enum: [fact, assessment, buyer]
        certification:
          type: boolean
        concerns_people:
          type: boolean
    ProfileSection:
      type: object
      additionalProperties: false
      required: [id, label, fields]
      properties:
        id:
          type: string
        label:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ProfileField"
    ProfileDefinition:
      type: object
      additionalProperties: false
      required: [hash, language, sections]
      properties:
        hash:
          description: Content hash (`sha256:` and 64 hex digits) of the definition; each run records it.
          type: string
        language:
          type: string
          enum: [en, fr]
        sections:
          type: array
          items:
            $ref: "#/components/schemas/ProfileSection"
    RunStatus:
      type: string
      enum: [queued, running, paused, stopped, failed, insufficient_sources, partial, completed]
    RunStage:
      type: string
      enum: [identity, collection, extraction, assessment]
    RunDependency:
      description: The dependency that made a run pause.
      type: string
      enum:
        - structuring_provider
        - retrieval_provider
        - llm_provider
        - registry
        - website
        - database
        - network
    RunStart:
      type: object
      additionalProperties: false
      required: [identity_id]
      properties:
        identity_id:
          type: string
          format: uuid
    RunRoleModel:
      type: object
      additionalProperties: false
      required: [role, config_id, provider, model_id]
      properties:
        role:
          type: string
          enum: [retrieval, structuring]
        config_id:
          type: string
        provider:
          type: string
        model_id:
          type: string
    ExcludedSource:
      description: A source the crawler did not use, at the site owner's request.
      type: object
      additionalProperties: false
      required: [domain, message]
      properties:
        domain:
          type: string
        message:
          description: Always "Source excluded at the site owner's request."
          type: string
    RunUsage:
      description: Totals of every provider call attempt of the run (failed and retried included).
      type: object
      additionalProperties: false
      required: [calls, input_tokens, output_tokens, reasoning_tokens, tool_calls, cost, roles]
      properties:
        calls:
          type: integer
        input_tokens:
          type: integer
        output_tokens:
          description: Without reasoning tokens.
          type: integer
        reasoning_tokens:
          type: integer
        tool_calls:
          type: integer
        cost:
          description: Cost in EUR, as a decimal string.
          type: string
        roles:
          description: Provider and model ID used per role, first used first.
          type: array
          items:
            $ref: "#/components/schemas/RunRoleModel"
    Run:
      type: object
      additionalProperties: false
      required:
        - id
        - identity_id
        - supplier_name
        - status
        - stage
        - stop_requested
        - counts_against_quota
        - pause_dependency
        - pause_reason
        - error
        - profile_definition_hash
        - prompt_set_hash
        - usage
        - excluded_sources
        - identity_to_verify
        - grounding_failures
        - invalid_items
        - insufficient_sources_explanation
        - created_at
        - started_at
        - finished_at
      properties:
        id:
          type: string
          format: uuid
        identity_id:
          type: string
          format: uuid
        supplier_name:
          description: The confirmed legal name. Null for an administrator of a hosted instance.
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/RunStatus"
        stage:
          $ref: "#/components/schemas/RunStage"
        stop_requested:
          type: boolean
        counts_against_quota:
          description: >-
            Whether the run counts against the organisation's profile quota. Paused runs, runs
            that failed on a dependency and runs that end `insufficient_sources` do not count.
          type: boolean
        pause_dependency:
          oneOf:
            - $ref: "#/components/schemas/RunDependency"
            - type: "null"
        pause_reason:
          description: Plain-language reason, naming the dependency. Null unless paused.
          type: [string, "null"]
        error:
          description: Plain-language reason of a failed run. Null otherwise.
          type: [string, "null"]
        profile_definition_hash:
          description: Hash of the profile definition the run uses (ProfileDefinition.hash), set when the run starts.
          type: [string, "null"]
        prompt_set_hash:
          type: [string, "null"]
        usage:
          $ref: "#/components/schemas/RunUsage"
        excluded_sources:
          description: >-
            Domains the crawler did not use because the site owner reserved text and data mining,
            blocked AI crawlers, or asked for suppression. Only the domain and the message are
            shown; the crawl-permission record itself is readable by the administrator only.
          type: array
          items:
            $ref: "#/components/schemas/ExcludedSource"
        identity_to_verify:
          description: >-
            True when, after collection, nothing has confirmed the identity: the confirmed legal
            name appears in none of the website's sources, or the website gave no source but
            other sources were found. False when nothing at all was found (the run ends
            `insufficient_sources`). The buyer verifies the identity; nothing is blocked.
          type: boolean
        grounding_failures:
          description: >-
            Extraction: the number of values discarded because their quote was not found in the
            stored text of the cited source (also a quote that cites a source that is not the one
            given, a quote over 300 characters, and a value its quote does not support). 0 until
            the extraction stage has run.
          type: integer
          minimum: 0
        invalid_items:
          description: >-
            Extraction: the number of items the structuring provider returned that did not match
            the schema, dropped after one retry. 0 until the extraction stage has run.
          type: integer
          minimum: 0
        insufficient_sources_explanation:
          description: >-
            Plain-language explanation, set when the status is `insufficient_sources`: no usable
            public source was collected, the failure log is available at
            `GET /runs/{id}/failures`, and the run does not count against the quota. Null otherwise.
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
    Source:
      description: A page or PDF collected for a run (the extracted text is not listed).
      type: object
      additionalProperties: false
      required: [id, url, fetched_at, content_type]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
        fetched_at:
          type: string
          format: date-time
        content_type:
          description: Media type of the response, for example `text/html` or `application/pdf`.
          type: string
    SourceList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Source"
    RunFailure:
      type: object
      additionalProperties: false
      required: [id, url, strategy, kind, next_strategy, message, created_at]
      properties:
        id:
          type: string
          format: uuid
        url:
          description: The address that failed; null for a failure that has none (the retrieval provider).
          type: [string, "null"]
        strategy:
          $ref: "#/components/schemas/CollectionStrategy"
        kind:
          type: string
          enum:
            - http_error
            - timeout
            - unreachable
            - empty_content
            - blocked_by_robots
            - refused
            - too_large
            - not_a_page
            - provider_unavailable
            - invalid_response
            - attempt_cap
        next_strategy:
          description: The strategy chosen next; null when none is left.
          oneOf:
            - $ref: "#/components/schemas/CollectionStrategy"
            - type: "null"
        message:
          description: Plain-language description. Absence is never a statement about the supplier.
          type: string
        created_at:
          type: string
          format: date-time
    CollectionStrategy:
      type: string
      enum: [website, sitemap, retrieval]
    RunFailureList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RunFailure"
    FactStatus:
      description: >-
        `proposed` for a value kept by extraction; `not_found` for a field with no kept value
        ("No public evidence found"). Review (`approved`, `corrected`) is added with the review
        endpoints.
      type: string
      enum: [proposed, not_found]
    SourceType:
      description: >-
        `supplier_claim` ("Supplier's own claim"): the source is on the confirmed website's domain
        or one of its subdomains (with or without `www`), on a domain listed in the identity's
        registry identifiers, or is a PDF linked from a page of the confirmed website, wherever it
        is hosted. `third_party` ("Third-party source") otherwise.
      type: string
      enum: [supplier_claim, third_party]
    Fact:
      description: >-
        The extracted value of one `fact` field with its evidence. For `not_found` every
        evidence member is null (and `quote_redacted` is false).
      type: object
      additionalProperties: false
      required:
        - id
        - section
        - field
        - status
        - value
        - quote
        - quote_redacted
        - source_id
        - source_url
        - source_type
        - publisher
        - author
        - fetched_at
        - verification_url
      properties:
        id:
          type: string
          format: uuid
        section:
          description: Id of the section of the profile definition.
          type: string
        field:
          description: Id of the field of the profile definition.
          type: string
        status:
          $ref: "#/components/schemas/FactStatus"
        value:
          type: [string, "null"]
        quote:
          description: >-
            At most 300 characters, verbatim from the source in its source language (never
            translated), found in the stored redacted text of the source. May be identifiable.
          type: [string, "null"]
        quote_redacted:
          description: True when the quote contains a redaction mark `[…]` ("Redacted extract").
          type: boolean
        source_id:
          description: The source of the quote (see `GET /runs/{id}/sources`).
          type: [string, "null"]
          format: uuid
        source_url:
          type: [string, "null"]
        source_type:
          oneOf:
            - $ref: "#/components/schemas/SourceType"
            - type: "null"
        publisher:
          description: The site name or, failing that, the domain of the source.
          type: [string, "null"]
        author:
          description: The author of the source when it names one (a PDF); otherwise null.
          type: [string, "null"]
        fetched_at:
          description: When the source was fetched ("Found in <source> on <date>").
          type: [string, "null"]
          format: date-time
        verification_url:
          description: >-
            For a certification field with a kept value: the IAF CertSearch address where the
            buyer verifies the certificate ("Verify on IAF CertSearch"). Null otherwise.
          type: [string, "null"]
    FactList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Fact"
    RunList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Run"
    HealthStatus:
      type: object
      additionalProperties: false
      required: [api, database, missing_settings]
      properties:
        api:
          description: Status of the API process. It is always available when it answers.
          type: string
          const: available
        database:
          description: Whether the API can reach its database.
          type: string
          enum: [available, unavailable]
        missing_settings:
          description: >-
            Names of the API key settings required by the selected provider configurations that
            are not set (for example `GEMINI_API_KEY`), sorted. Empty when every key is set. A
            profile run cannot start while a name is listed. Never contains a value.
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: "^[A-Z][A-Z0-9_]*$"
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          description: Compared without case and surrounding spaces.
          type: string
          minLength: 1
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 1024
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, email, role, organisation_id]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [admin, member]
        organisation_id:
          type: string
          format: uuid
    Error:
      type: object
      additionalProperties: false
      required: [detail]
      properties:
        detail:
          description: A plain message for the user. Never a stack trace or a submitted value.
          type: string
    ValidationError:
      type: object
      additionalProperties: false
      required: [detail, errors]
      properties:
        detail:
          type: string
        errors:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [field, message]
            properties:
              field:
                description: Name of the offending field, or `body` when the body itself is invalid.
                type: string
              message:
                type: string
    User:
      type: object
      additionalProperties: false
      required: [id, organisation_id, email, role, created_at, last_login_at]
      properties:
        id:
          type: string
          format: uuid
        organisation_id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [admin, member]
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: [string, "null"]
          format: date-time
    OrganisationCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          description: Surrounding spaces are removed; it must not be empty.
          type: string
          minLength: 1
          maxLength: 200
        seat_limit:
          description: Maximum number of users in the organisation. Null or absent means unlimited.
          type: [integer, "null"]
          minimum: 1
          maximum: 2147483647
        profile_quota:
          description: Maximum number of profiles. Null or absent means unlimited.
          type: [integer, "null"]
          minimum: 1
          maximum: 2147483647
        access_period_days:
          description: >-
            Length of the access period, counted from activation. Null or absent means unlimited.
            The maximum is a technical bound only.
          type: [integer, "null"]
          minimum: 1
          maximum: 36500
    Organisation:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - status
        - seat_limit
        - profile_quota
        - access_period_days
        - access_ends_at
        - member_count
        - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [pending_activation, active, acceptance_renewal_required]
        seat_limit:
          type: [integer, "null"]
        profile_quota:
          type: [integer, "null"]
        access_period_days:
          type: [integer, "null"]
        access_ends_at:
          description: End of access. Null while not yet activated, or when the access is unlimited.
          type: [string, "null"]
          format: date-time
        member_count:
          description: Number of users in the organisation (counted against the seat limit).
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
    MemberOrganisation:
      description: >-
        What a member sees of their own organisation. Nothing about any other organisation.
      type: object
      additionalProperties: false
      required:
        - name
        - status
        - seat_limit
        - profile_quota
        - profiles_remaining
        - run_refusal_reason
        - access_ends_at
      properties:
        name:
          type: string
        status:
          type: string
          enum: [pending_activation, active, acceptance_renewal_required]
        seat_limit:
          description: Maximum number of users. Null means unlimited.
          type: [integer, "null"]
        profile_quota:
          description: Maximum number of profile runs. Null means unlimited.
          type: [integer, "null"]
        profiles_remaining:
          description: >-
            Profile runs that may still start: the quota minus the runs that count against it,
            never below 0. Null when the quota is unlimited.
          type: [integer, "null"]
        run_refusal_reason:
          description: >-
            Why a new run would be refused now, or null when it would be accepted. Checked in
            this order: not activated, access ended, quota used, instance monthly spend cap reached.
          type: [string, "null"]
          enum: [not_activated, access_ended, quota_reached, spend_cap_reached, null]
        access_ends_at:
          description: End of access. Null while not yet activated, or when the access is unlimited.
          type: [string, "null"]
          format: date-time
    OrganisationList:
      type: object
      additionalProperties: false
      required: [organisations]
      properties:
        organisations:
          type: array
          items:
            $ref: "#/components/schemas/Organisation"
    OrganisationAccessUpdate:
      type: object
      additionalProperties: false
      required: [access_ends_at]
      properties:
        access_ends_at:
          description: >-
            New end of access, with a time zone. Must be in the future and later than the current
            `access_ends_at`.
          type: string
          format: date-time
    InvitationCreate:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          description: Stored trimmed and lower-cased.
          type: string
          minLength: 3
          maxLength: 320
    CreatedInvitation:
      type: object
      additionalProperties: false
      required: [id, organisation_id, email, expires_at, link]
      properties:
        id:
          type: string
          format: uuid
        organisation_id:
          type: string
          format: uuid
        email:
          type: string
        expires_at:
          type: string
          format: date-time
        link:
          description: >-
            The single-use link for the invited person: the frontend origin followed by
            `/invitations/<token>`. It is returned once and cannot be shown again.
          type: string
    InvitationCheck:
      type: object
      additionalProperties: false
      required: [email, organisation_name, expires_at]
      properties:
        email:
          type: string
        organisation_name:
          type: string
        expires_at:
          type: string
          format: date-time
    InvitationAccept:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          description: At least the configured minimum length (`PASSWORD_MIN_LENGTH`).
          type: string
          minLength: 1
          maxLength: 1024
