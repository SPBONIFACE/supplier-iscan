openapi: 3.1.0
info:
  title: Supplier iScan API
  version: 0.4.0
  description: >-
    API contract of Supplier iScan. This file is the source of truth: it changes before the code.


    Authentication: `POST /auth/login` sets a session cookie (`HttpOnly`, `Secure`, `SameSite=Lax`).
    Every operation that declares the `sessionCookie` security requirement answers 401 when the
    cookie is missing, expired, revoked by a logout, or tampered with.
servers:
  - url: http://localhost:8000
    description: Local development (Docker Compose)
tags:
  - name: system
    description: Operational endpoints
  - name: auth
    description: Sign-in, sign-out and the current user
  - name: users
    description: User records
  - name: admin
    description: Administrator operations. A signed-in member gets 403 on every one of them.
  - name: invitations
    description: Public invitation links (the token is the credential)
# Operations are public unless they declare `security`.
paths:
  /health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Report whether the API and its database are available
      description: >-
        Always answers while the API process runs. Returns 200 when the database answers, and 503
        when it does not. The body never contains error details. `missing_settings` names the API
        key settings that the provider configurations selected for retrieval and structuring need
        and that are not set; it gives names only, never a value, and does not change the status.
      responses:
        "200":
          description: The API and the database are available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                api: available
                database: available
                missing_settings: []
        "503":
          description: The API is running but the database is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example:
                api: available
                database: unavailable
                missing_settings: [GEMINI_API_KEY]
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with email and password
      description: >-
        On success, sets the session cookie and returns the signed-in user. A wrong password and an
        unknown email get the same 401 answer, so the response never reveals whether an account
        exists. Each attempt, successful or not, is recorded in the usage log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in. The session cookie is set.
          headers:
            Set-Cookie:
              description: >-
                `supplier_iscan_session=<token>; HttpOnly; Secure; SameSite=Lax; Path=/;
                Max-Age=<seconds>`. Only a hash of the token is stored on the server.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out
      description: >-
        Revokes the current session on the server and clears the cookie. Replaying the old cookie
        afterwards answers 401.
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Signed out. The session cookie is cleared.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Return the signed-in user
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The user of the current session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Read a user record
      description: >-
        A member reads only their own record; any other id answers 404 with the same body as an
        id that does not exist. An administrator reads any user.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /admin/organisations:
    post:
      operationId: createOrganisation
      tags: [admin]
      summary: Create an organisation with its limits
      description: >-
        Administrator only. The organisation starts in status `pending_activation`, or `active` on
        a self-hosted instance (`INSTANCE_MODE=self_hosted`), where activation is skipped. A limit
        left empty or null means unlimited. The access period starts at activation: on a
        self-hosted instance at once, so `access_ends_at` is set on creation; otherwise it stays
        null until the organisation is activated.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganisationCreate"
      responses:
        "201":
          description: The organisation was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organisation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      operationId: listOrganisations
      tags: [admin]
      summary: List the organisations
      description: Administrator only. Oldest first.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: All organisations of the instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganisationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /admin/organisations/{id}:
    patch:
      operationId: extendOrganisationAccess
      tags: [admin]
      summary: Extend an organisation's access
      description: >-
        Administrator only. Sets a later `access_ends_at`. A date that is not later than the
        current one, or not in the future, answers 422.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganisationAccessUpdate"
      responses:
        "200":
          description: The updated organisation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organisation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /admin/organisations/{id}/invitations:
    post:
      operationId: createInvitation
      tags: [admin]
      summary: Invite a person into an organisation
      description: >-
        Administrator only. Returns a single-use link for the administrator to send (no email is
        sent). Only a hash of the token is stored, so the link cannot be shown again. The
        invitation expires after the configured delay (`INVITATION_VALIDITY_HOURS`). An email that
        already has an account answers 409.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCreate"
      responses:
        "201":
          description: The invitation was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedInvitation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: An account already exists for this email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: An account already exists for this email.
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /admin/invitations/{id}:
    delete:
      operationId: revokeInvitation
      tags: [admin]
      summary: Revoke an unused invitation
      description: >-
        Administrator only. Accepting the invitation is refused afterwards. Revoking an invitation
        that is already revoked changes nothing (204); one that was already used answers 409.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "204":
          description: The invitation is revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The invitation was already used.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: This invitation has already been used.
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /invitations/{token}:
    get:
      operationId: checkInvitation
      tags: [invitations]
      summary: Check an invitation link
      description: >-
        Public: the token is the credential. A used, expired, revoked or unknown token answers the
        same 404, which says nothing about any account.
      parameters:
        - $ref: "#/components/parameters/InvitationToken"
      responses:
        "200":
          description: The invitation is valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationCheck"
        "404":
          $ref: "#/components/responses/InvalidInvitation"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /invitations/{token}/accept:
    post:
      operationId: acceptInvitation
      tags: [invitations]
      summary: Accept an invitation and set a password
      description: >-
        Public: the token is the credential. Creates the user (role `member`) in the invitation's
        organisation, marks the invitation used and signs the person in: the session cookie is set
        as on `POST /auth/login`. A used, expired, revoked or unknown token answers the same 404.
        A password shorter than the configured minimum (`PASSWORD_MIN_LENGTH`) answers 422. When
        the organisation has as many members as its seat limit, the answer is 409.
      parameters:
        - $ref: "#/components/parameters/InvitationToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationAccept"
      responses:
        "200":
          description: The account is created and the person is signed in.
          headers:
            Set-Cookie:
              description: The session cookie, exactly as set by `POST /auth/login`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "404":
          $ref: "#/components/responses/InvalidInvitation"
        "409":
          description: The organisation has no free seat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                detail: Seat limit reached.
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: The resource's UUID. A value that is not a UUID answers 404, as an unknown id.
      schema:
        type: string
    InvitationToken:
      name: token
      in: path
      required: true
      description: The token from the invitation link.
      schema:
        type: string
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: supplier_iscan_session
      description: >-
        Opaque session token set by `POST /auth/login`. Sessions are stored on the server and
        expire; logout revokes them.
  responses:
    Unauthorized:
      description: >-
        No valid session (missing, expired, revoked or tampered cookie), or, for login, a wrong
        email or password. The message is generic.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            session:
              value:
                detail: Authentication required.
            login:
              value:
                detail: Incorrect email or password.
    ValidationFailed:
      description: >-
        The request body is malformed or a field is missing, empty or too long. Submitted values are
        never echoed back.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
          example:
            detail: The request is not valid.
            errors:
              - field: email
                message: Email is required.
    Forbidden:
      description: Signed in, but this operation is for administrators only.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            detail: Administrator access required.
    NotFound:
      description: >-
        The resource does not exist, or the caller may not see it. Both answers are identical, so
        that the existence of a resource is never revealed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            detail: Not found.
    InvalidInvitation:
      description: >-
        The invitation link cannot be used: it is unknown, expired, revoked or already used. The
        message is the same in every case.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            detail: This invitation link is not valid. Ask your administrator for a new one.
    ServiceUnavailable:
      description: The database is unavailable. Plain message, no technical details.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            detail: The service is temporarily unavailable. Please try again in a few minutes.
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [api, database, missing_settings]
      properties:
        api:
          description: Status of the API process. It is always available when it answers.
          type: string
          const: available
        database:
          description: Whether the API can reach its database.
          type: string
          enum: [available, unavailable]
        missing_settings:
          description: >-
            Names of the API key settings required by the selected provider configurations that
            are not set (for example `GEMINI_API_KEY`), sorted. Empty when every key is set. A
            profile run cannot start while a name is listed. Never contains a value.
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: "^[A-Z][A-Z0-9_]*$"
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          description: Compared without case and surrounding spaces.
          type: string
          minLength: 1
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 1024
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, email, role, organisation_id]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [admin, member]
        organisation_id:
          type: string
          format: uuid
    Error:
      type: object
      additionalProperties: false
      required: [detail]
      properties:
        detail:
          description: A plain message for the user. Never a stack trace or a submitted value.
          type: string
    ValidationError:
      type: object
      additionalProperties: false
      required: [detail, errors]
      properties:
        detail:
          type: string
        errors:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [field, message]
            properties:
              field:
                description: Name of the offending field, or `body` when the body itself is invalid.
                type: string
              message:
                type: string
    User:
      type: object
      additionalProperties: false
      required: [id, organisation_id, email, role, created_at, last_login_at]
      properties:
        id:
          type: string
          format: uuid
        organisation_id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [admin, member]
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: [string, "null"]
          format: date-time
    OrganisationCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          description: Surrounding spaces are removed; it must not be empty.
          type: string
          minLength: 1
          maxLength: 200
        seat_limit:
          description: Maximum number of users in the organisation. Null or absent means unlimited.
          type: [integer, "null"]
          minimum: 1
          maximum: 2147483647
        profile_quota:
          description: Maximum number of profiles. Null or absent means unlimited.
          type: [integer, "null"]
          minimum: 1
          maximum: 2147483647
        access_period_days:
          description: >-
            Length of the access period, counted from activation. Null or absent means unlimited.
            The maximum is a technical bound only.
          type: [integer, "null"]
          minimum: 1
          maximum: 36500
    Organisation:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - status
        - seat_limit
        - profile_quota
        - access_period_days
        - access_ends_at
        - member_count
        - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [pending_activation, active, acceptance_renewal_required]
        seat_limit:
          type: [integer, "null"]
        profile_quota:
          type: [integer, "null"]
        access_period_days:
          type: [integer, "null"]
        access_ends_at:
          description: End of access. Null while not yet activated, or when the access is unlimited.
          type: [string, "null"]
          format: date-time
        member_count:
          description: Number of users in the organisation (counted against the seat limit).
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
    OrganisationList:
      type: object
      additionalProperties: false
      required: [organisations]
      properties:
        organisations:
          type: array
          items:
            $ref: "#/components/schemas/Organisation"
    OrganisationAccessUpdate:
      type: object
      additionalProperties: false
      required: [access_ends_at]
      properties:
        access_ends_at:
          description: >-
            New end of access, with a time zone. Must be in the future and later than the current
            `access_ends_at`.
          type: string
          format: date-time
    InvitationCreate:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          description: Stored trimmed and lower-cased.
          type: string
          minLength: 3
          maxLength: 320
    CreatedInvitation:
      type: object
      additionalProperties: false
      required: [id, organisation_id, email, expires_at, link]
      properties:
        id:
          type: string
          format: uuid
        organisation_id:
          type: string
          format: uuid
        email:
          type: string
        expires_at:
          type: string
          format: date-time
        link:
          description: >-
            The single-use link for the invited person: the frontend origin followed by
            `/invitations/<token>`. It is returned once and cannot be shown again.
          type: string
    InvitationCheck:
      type: object
      additionalProperties: false
      required: [email, organisation_name, expires_at]
      properties:
        email:
          type: string
        organisation_name:
          type: string
        expires_at:
          type: string
          format: date-time
    InvitationAccept:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          description: At least the configured minimum length (`PASSWORD_MIN_LENGTH`).
          type: string
          minLength: 1
          maxLength: 1024
