[project]
name = "supplier-iscan-backend"
version = "0.1.0"
description = "Supplier iScan API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.20.0",
    "anthropic==1.13.0",
    "argon2-cffi==25.1.0",
    "fastapi==0.143.0",
    "google-genai==2.30.1",
    "httpx2==2.13.1",
    "jinja2==3.1.6",
    "jsonschema==4.26.0",
    "mistralai==3.2.0",
    "openai==3.29.0",
    "perplexityai==0.43.8",
    "phonenumbers==9.0.41",
    "protego==0.7.0",
    "protobuf==7.36.2",
    "psycopg[binary]==3.3.6",
    "pypdf==6.21.2",
    "spacy==3.8.16",
    "spacy-pkuseg==1.0.1",
    "sqlalchemy==2.0.54",
    "uvicorn==0.54.0",
    # Server-side PDF (#39), approved-dependencies.md.
    "weasyprint==70.0",
    # Name-detection models (#19): not on PyPI; pinned release wheels, sha256 in uv.lock.
    "zh-core-web-sm",
    # Name detection (#19, owner decisions D-066 and D-068): GLiNER on CPU PyTorch. The model files
    # are not Python packages: scripts/fetch_model.py downloads them at build time, sha256-checked.
    "gliner==0.2.29",
    "torch==2.14.1",
    "transformers==5.16.1",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "ruff==0.17.0",
]

[tool.uv]
# The project is an application, not a library: nothing is built or published.
package = false
required-version = "==0.12.24"
# Supply chain: every package in uv.lock, transitive ones included, is at least 14 days old
# at the time of locking (last moved 27 Oct 2026 for #11, _docs/process/approved-dependencies.md).
# Wheels only: no source distribution is ever built.
exclude-newer = "2026-10-13T20:00:00Z"
# SEC exception (approved-dependencies.md): pypdf 6.21.2 fixes the advisories of 6.20.1 (#18).
# SEC exception: pillow 13.0.0 (transitive of WeasyPrint) fixes the critical advisories of 12.3.0 (#39).
exclude-newer-package = { pypdf = "2026-10-22T00:00:00Z", pillow = "2026-10-17T00:00:00Z" }
constraint-dependencies = ["pillow==13.0.0"]
no-build = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# CPU build of PyTorch on Linux (the PyPI Linux wheel pulls about 3 GB of CUDA libraries). macOS wheels
# on PyPI are CPU only.
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
zh-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/zh_core_web_sm-3.8.0/zh_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# The evaluation harness (#22) lives in ../eval and is imported as the package `eval`.
pythonpath = [".."]
addopts = "-ra --strict-markers -m 'not model'"
markers = ["model: needs the real name-detection model (make fetch-model); run by make test-model and CI"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# S105/S106: tests use fixed, throwaway credentials.
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app", "tests", "../eval"]
mypy_path = [".."]

[[tool.mypy.overrides]]
module = ["yaml", "jsonschema", "jsonschema.*", "weasyprint", "weasyprint.*"]
ignore_missing_imports = true
