[project]
name = "supplier-iscan-backend"
version = "0.1.0"
description = "Supplier iScan API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.20.0",
    "anthropic==1.13.0",
    "argon2-cffi==25.1.0",
    "fastapi==0.143.0",
    "google-genai==2.30.1",
    "httpx2==2.13.1",
    "jsonschema==4.26.0",
    "mistralai==3.2.0",
    "openai==3.29.0",
    "perplexityai==0.43.8",
    "phonenumbers==9.0.41",
    "protego==0.7.0",
    "psycopg[binary]==3.3.6",
    "pypdf==6.21.2",
    "spacy==3.8.16",
    "spacy-pkuseg==1.0.1",
    "sqlalchemy==2.0.54",
    "uvicorn==0.54.0",
    # Name-detection models (#19): not on PyPI; pinned release wheels, sha256 in uv.lock.
    "en-core-web-sm",
    "de-core-news-sm",
    "xx-ent-wiki-sm",
    "zh-core-web-sm",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "ruff==0.17.0",
]

[tool.uv]
# The project is an application, not a library: nothing is built or published.
package = false
required-version = "==0.12.24"
# Supply chain: every package in uv.lock, transitive ones included, is at least 14 days old
# at the time of locking (last moved 27 Oct 2026 for #11, _docs/process/approved-dependencies.md).
# Wheels only: no source distribution is ever built.
exclude-newer = "2026-10-13T20:00:00Z"
# SEC exception (approved-dependencies.md): pypdf 6.21.2 fixes the advisories of 6.20.1 (#18).
exclude-newer-package = { pypdf = "2026-10-22T00:00:00Z" }
no-build = true

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
de-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl" }
xx-ent-wiki-sm = { url = "https://github.com/explosion/spacy-models/releases/download/xx_ent_wiki_sm-3.8.0/xx_ent_wiki_sm-3.8.0-py3-none-any.whl" }
zh-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/zh_core_web_sm-3.8.0/zh_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# S105/S106: tests use fixed, throwaway credentials.
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["yaml", "jsonschema", "jsonschema.*"]
ignore_missing_imports = true
